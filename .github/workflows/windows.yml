name: Windows MVP
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies and Electron
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser for UI tests
        run: npx playwright install chromium
      - name: Test source application on Windows
        run: npm run test:e2e
      - name: Build Windows x64 NSIS installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            '### Windows installer build failure' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content windows-build.log -Tail 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          exit $buildExitCode
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged x64 FFmpeg and FFprobe
        run: node scripts/verify-windows-package.mjs
      - name: Install NSIS package silently on Windows
        shell: pwsh
        run: ./scripts/windows-installer.ps1 -Action Install
      - name: Test installed application and real MP4 export
        run: npx playwright test --project=desktop --output=test-results/installed
      - name: Uninstall NSIS package
        if: always()
        shell: pwsh
        run: ./scripts/windows-installer.ps1 -Action Uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: NIGHTFRAME-Windows-x64-unsigned
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            test-results/
            .local/output.mp4
            release/builder-effective-config.yaml
            windows-build.log
          if-no-files-found: warn
